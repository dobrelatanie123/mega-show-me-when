<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- R6: scripts/stamp.mjs stamps the git sha of the build here and in the footer. -->
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight <span class="status" data-role="status"></span></p>
    </header>
    <main data-testid="board">
      <!-- R3: shown until the first answer comes back, then removed. -->
      <div data-testid="loader" class="loader" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span> Loading incidents…
      </div>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <ul data-testid="incident-list" class="list" aria-live="polite"></ul>
    </main>
    <!-- Product decision (step 2): Ack asks to confirm, and the confirm names the incident id. -->
    <dialog data-testid="confirm" class="confirm" aria-labelledby="confirm-title">
      <p id="confirm-title" class="confirm-title">Ack <strong data-role="confirm-id"></strong>?</p>
      <p class="confirm-what" data-role="confirm-what"></p>
      <div class="confirm-actions">
        <button type="button" data-testid="confirm-cancel" class="btn" autofocus>Cancel</button>
        <button type="button" data-testid="confirm-ack" class="btn primary">Ack <span data-role="confirm-id"></span></button>
      </div>
    </dialog>
    <footer>sched-prod incident board · build <code data-testid="build-sha">__BUILD_SHA__</code></footer>
  </body>
</html>
